# Review preview on GitHub Pages: https://vivian4fb.github.io/martin-website/
# Manual trigger only, so nothing is published until you choose to run it.
# Requires Settings → Pages → Source: "GitHub Actions" (private repos need GitHub Pro).
# A Pages site is PUBLIC to anyone with the URL, even from a private repo.
name: Deploy review preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_SITE: https://vivian4fb.github.io
          ASTRO_BASE: /martin-website
          PUBLIC_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
