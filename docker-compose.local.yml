# Local check of the production image, without Caddy or certificates.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build site
#   BASE=http://localhost:8080 node scripts/click-test.mjs
#   docker compose -f docker-compose.yml -f docker-compose.local.yml down
#
# Naming only the `site` service leaves Caddy out, so nothing tries to reach the real domain.

services:
  site:
    ports:
      - "${SITE_PORT:-8080}:8080"
