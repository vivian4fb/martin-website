# Static serving for the holography site.
# Byte-range requests (the films) are handled by nginx natively — do not gzip video.
#
# Header inheritance: any block with its own add_header loses every inherited one, so each such
# block includes security-headers.conf. See the comment in that file.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset utf-8;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Text only. Video and images are already compressed.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      image/svg+xml application/xml application/rss+xml;

    include /etc/nginx/conf.d/security-headers.conf;

    # Astro writes /page/index.html, so a missing trailing slash must redirect, not 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Content-hashed assets: safe to cache forever.
    location /_astro/ {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Media keeps its name across deploys, so cache for a week and revalidate.
    location /media/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # HTML must never be held by a proxy, or a deploy goes unnoticed.
    location ~* \.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Health endpoint for the container and any load balancer in front.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt { access_log off; }
    location = /favicon.svg { access_log off; expires 7d; }

    # Nothing here is a dotfile the public should read.
    location ~ /\. { deny all; }
}
