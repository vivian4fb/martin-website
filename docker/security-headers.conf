# Included by every block in nginx.conf that sets its own add_header.
#
# nginx inherits add_header directives only into blocks that declare NONE of their own: one
# add_header in a location silently drops every inherited one. Serving "/" re-enters the .html
# location through try_files, so without this include the pages people actually read would ship
# with no security headers at all.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
